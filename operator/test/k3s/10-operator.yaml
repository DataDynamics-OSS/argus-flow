# k3s 통합 테스트용 오퍼레이터 배포 — 네임스페이스 한정.
#  - 권한: deploy/rbac.yaml과 같은 규칙의 ClusterRole을 만들되, ClusterRoleBinding이 아니라
#    nifi-optest 네임스페이스의 RoleBinding으로만 바인딩한다(다른 네임스페이스 권한 없음).
#  - 실행: args --namespace=nifi-optest --standalone (클러스터 범위 peering 미사용)
#  - 이미지: 로컬 빌드 후 k3s containerd로 import (imagePullPolicy: IfNotPresent)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nifi-operator
  namespace: nifi-optest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nifi-optest-operator-role
rules:
  - apiGroups: ["datadynamics.io"]
    resources: ["nificlusters", "nificlusters/status", "nififlows", "nififlows/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "pods", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nifi-operator
  namespace: nifi-optest
subjects:
  - kind: ServiceAccount
    name: nifi-operator
    namespace: nifi-optest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nifi-optest-operator-role
---
# kopf는 --namespace 모드에서도 시작 시 CRD 목록(리소스 디스커버리)과 네임스페이스 목록
# (네임스페이스 패턴 매칭)을 클러스터 범위로 조회한다 → 읽기 전용 ClusterRole 최소 부여.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nifi-optest-operator-discovery
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nifi-optest-operator-discovery
subjects:
  - kind: ServiceAccount
    name: nifi-operator
    namespace: nifi-optest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nifi-optest-operator-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nifi-operator
  namespace: nifi-optest
  labels:
    app: nifi-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nifi-operator
  template:
    metadata:
      labels:
        app: nifi-operator
    spec:
      serviceAccountName: nifi-operator
      containers:
        - name: operator
          image: nifi-operator:test   # 테스트 시 sed로 실제 태그로 치환
          imagePullPolicy: IfNotPresent
          # 이미지 CMD(--all-namespaces)를 대체 → 이 네임스페이스만 감시
          args: ["--namespace=nifi-optest", "--standalone"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
