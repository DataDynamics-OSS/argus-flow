apiVersion: apps/v1
kind: Deployment
metadata:
  name: nifi-operator
  namespace: nifi-operator-system
  labels:
    app: nifi-operator
    app.kubernetes.io/managed-by: nifi-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nifi-operator
  template:
    metadata:
      labels:
        app: nifi-operator
    spec:
      serviceAccountName: nifi-operator
      containers:
        - name: operator
          image: datadynamics/nifi-operator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
