operator:
  image:
    # Docker Hub 공개 이미지. 태그는 차트 버전과 같다 (scripts/set-version.sh 가 갱신)
    repository: datadynamics/argus-flow-operator
    tag: "0.5.1"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
