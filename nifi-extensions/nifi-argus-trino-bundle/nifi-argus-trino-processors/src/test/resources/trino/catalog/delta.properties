# 통합 테스트 전용: 파일 메타스토어 + 로컬 파일시스템.
# Trino 483 은 delta.enable-non-concurrent-writes=true 여도 로컬 파일시스템 쓰기(INSERT/OPTIMIZE)를 거부한다(확인함).
# 그래서 Delta 는 빈 테이블로 VACUUM·ANALYZE 만 성공 경로로 확인한다.
connector.name=delta_lake
hive.metastore=file
hive.metastore.catalog.dir=local:///
fs.native-local.enabled=true
local.location=/tmp/trino-it/delta
delta.enable-non-concurrent-writes=true
