name: 버그 리포트
description: 동작하지 않는 부분을 알려 주십시오
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        보안 취약점은 이 양식이 아니라 [SECURITY.md](../blob/main/SECURITY.md)의
        비공개 제보 절차를 이용해 주십시오.

  - type: dropdown
    id: component
    attributes:
      label: 구성요소
      description: 문제가 발생한 부분
      options:
        - "확장: standard"
        - "확장: db"
        - "확장: kudu"
        - "확장: parquet"
        - "확장: record-serialization"
        - "확장: hive"
        - "확장: reporting"
        - "확장: debezium (CDC)"
        - "확장: deltalake"
        - "확장: iceberg"
        - "확장: flow-analysis"
        - "배포 패키징 (tar.gz / RPM)"
        - "Kubernetes 오퍼레이터"
        - "Helm 차트"
        - "컨테이너 이미지"
        - "nifi-config CLI"
        - "기타 / 모르겠음"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Argus Flow 버전
      placeholder: "2.10.0-1"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: NiFi 버전, JDK, OS, Kubernetes 버전 등 관련된 것
      placeholder: "NiFi 2.10.0 / Temurin 21 / RHEL 9"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 일어났습니까
      description: 실제 동작과 기대한 동작을 함께 적어 주십시오
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스택 트레이스
      description: 관련된 부분만 붙여 주십시오. 자격증명·호스트명 등 민감정보는 지워 주십시오.
      render: text
