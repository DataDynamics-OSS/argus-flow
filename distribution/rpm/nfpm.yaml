# nfpm packaging descriptor — https://nfpm.goreleaser.com
# Usage: `make rpm` 또는 scripts/build-release.sh
#        (tarball 을 target/rpmroot/dist 에 풀고 nfpm 실행. contents.src 는 env 치환이
#        안 되므로 고정 경로 dist 를 쓴다)
# 결과 파일명: argus-flow-nifi-<version>-<release>.x86_64.rpm (Epoch 는 파일명에 들어가지 않음)
name: argus-flow-nifi
arch: x86_64
platform: linux
# 제품 버전(SemVer). scripts/set-version.sh 가 갱신하고 scripts/check-version.sh 가 검사한다.
# SNAPSHOT 등 프리릴리스는 nfpm 이 RPM 규칙에 맞게 `0.6.0~SNAPSHOT` 으로 바꾼다.
version: 0.5.1
# 같은 제품 버전을 패키징만 고쳐 다시 낼 때 올린다. 제품 버전이 바뀌면 1 로 돌아간다.
release: 1
# Epoch 1 고정 — 버전 체계를 `<NiFi>-<rev>`(2.10.0-1)에서 제품 SemVer(0.5.0)로 바꾸면서
# RPM 비교상 0.5.0 이 2.10.0 보다 낮아졌다. Epoch 없이는 argus-flow-nifi-2.10.0-1 이 설치된
# 서버에서 `dnf upgrade`/`rpm -U` 가 0.5.0 을 다운그레이드로 보고 거부한다.
# Epoch 는 버전보다 먼저 비교되므로 1:0.5.0-1 > (0:)2.10.0-1. 한 번 올린 Epoch 는 내릴 수
# 없으므로(내리면 이후 모든 버전이 낮은 것으로 비교됨) 앞으로도 1 로 둔다.
epoch: "1"
maintainer: DataDynamics <dev@datadynamics.io>
# 기반 NiFi 버전은 제품 버전과 별개다(루트 pom 의 nifi.version, check-version.sh 가 일치 검사).
description: |
  Argus Flow: Apache NiFi 2.10.0 repackaged with Argus Flow custom extensions.
license: Apache-2.0
homepage: https://github.com/DataDynamics

contents:
  - src: ../target/rpmroot/dist
    dst: /opt/argus-flow/nifi
  - src: ./nifi.service
    dst: /usr/lib/systemd/system/nifi.service
  - src: ./nifi-notify-failure.service
    dst: /usr/lib/systemd/system/nifi-notify-failure.service
  - src: ./argus-flow-nifi.sysconfig
    dst: /etc/sysconfig/argus-flow-nifi
    type: config|noreplace
  # conf/ 의 파일은 전부 config|noreplace 로 업그레이드 시 보존한다.
  # - nifi.properties: NiFi 가 첫 기동 때 sensitive props key 와 키스토어·트러스트스토어 비밀번호를
  #   생성해 써 넣는다. 덮어쓰면 기존 flow.json.gz 를 복호화하지 못해 기동이 실패한다.
  # - login-identity-providers.xml: 설치 후 `nifi.sh set-single-user-credentials` 로 바뀐다.
  # - 그 외 파일: 관리자나 bin/argus-config.sh 가 수정한다.
  # 패키지 기본값이 바뀌면 rpm 이 수정된 파일은 그대로 두고 <파일>.rpmnew 를 남긴다.
  # 디렉터리 entry(dist/)와 dst 가 겹치면 nfpm(2.48+)이 content collision 으로 거부하므로,
  # 빌드가 dist/conf 를 rpmroot/config 로 통째로 옮겨 둔다 (Makefile rpm, scripts/build-release.sh).
  - dst: /opt/argus-flow/nifi/conf
    type: dir
  - src: ../target/rpmroot/config/*
    dst: /opt/argus-flow/nifi/conf/
    type: config|noreplace

scripts:
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh
